<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Notepad</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #faf9f5;
        color: #1a1a1a;
        font-family: ui-sans-serif, system-ui, sans-serif;
        padding: 2rem;
      }
      .card {
        max-width: 26rem;
        text-align: center;
      }
      h1 {
        font-size: 1.75rem;
        margin: 0 0 0.75rem;
      }
      p {
        color: #6b665e;
        font-size: 0.9375rem;
        line-height: 1.6;
        margin: 0;
      }
      a {
        display: inline-block;
        margin-top: 1.5rem;
        padding: 0.5rem 1rem;
        border-radius: 0.875rem;
        background: #d97757;
        color: #1a1a1a;
        text-decoration: none;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You’re offline</h1>
      <p>
        This tracker works offline once it has loaded. Your tasks are stored in
        this browser and will be here when you reconnect.
      </p>
      <a href="/tdl/tracker">Try again</a>
    </div>
  </body>
</html>
